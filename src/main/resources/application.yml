server:
  port: 8080

spring:
  config:
    import: classpath:flow-definitions.yml
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: orchestrator

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level){level} %clr([%thread]){faint} %clr(%logger{36}){cyan} - %clr(%msg){level}%n%ex"

services:
  control-center:
    base-url: http://localhost:8081
  mcp-domain:
    base-url: http://localhost:9001
  mcp-notifications:
    base-url: http://localhost:9002

ollama:
  base-url: http://localhost:11434
  model: llama3.2:1b
  max-agent-turns: 8

orchestrator:
  mcp-servers:
    mcp-domain: ${services.mcp-domain.base-url}
    mcp-notifications: ${services.mcp-notifications.base-url}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
