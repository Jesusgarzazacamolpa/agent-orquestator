server:
  port: 8080

spring:
  config:
    import: classpath:flow-definitions.yml
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: orchestrator

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level){level} %clr([%thread]){faint} %clr(%logger{36}){cyan} %clr(traceId=%X{traceId}){faint} - %clr(%msg){level}%n%ex"

services:
  control-center:
    base-url: http://localhost:8081
    timeout-seconds: 10
  mcp-domain:
    base-url: http://localhost:9001
  mcp-notifications:
    base-url: http://localhost:9002

llm:
  # Proveedor activo del modelo de chat: ollama (local) u openai (API remota).
  provider: ollama

ollama:
  base-url: http://localhost:11434
  model: qwen2.5:7b
  temperature: 0.0
  top-p: 0.1
  # Ollama descarga el modelo tras 5 min de inactividad por defecto. Como el flujo
  # se pausa para pedir datos al usuario, cada pausa obligaba a recargar los ~4.7 GB
  # y el turno siguiente superaba el timeout. Usa -1 para no descargarlo nunca.
  keep-alive: 30m
  # Techo de tokens generados por turno: en CPU una respuesta larga supera los 180s.
  num-predict: 256
  max-agent-turns: 8
  max-context-messages: 20
  # qwen2.5:7b en local tarda 30-60s por turno y más si el modelo está frío tras
  # horas inactivo; 120s provocaba ERR_LLM_01 justo al reanudar por la mañana.
  timeout-seconds: 180
  max-retries: 3
  retry-wait-seconds: 2
  circuit-breaker-threshold: 50
  circuit-breaker-reset-seconds: 60

openai:
  # Solo se exige al arrancar cuando llm.provider=openai; se inyecta por entorno.
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com
  model: gpt-4o-mini
  temperature: 0.0
  top-p: 0.1
  # API remota: no necesita el margen de 180s del modelo local en CPU.
  timeout-seconds: 60

mcp:
  max-retries: 2
  step-timeout-seconds: 30
  circuit-breaker-threshold: 5
  circuit-breaker-reset-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      llm:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Una respuesta lenta (30-60s) es normal en Ollama local: solo se considera
        # "slow call" por encima de 90s para no abrir el circuito por latencia habitual.
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 90s
        wait-duration-in-open-state: 30s
        register-health-indicator: true
  retry:
    instances:
      llm:
        max-attempts: 2
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 10s
        # Reintentar solo fallos transitorios de red/servicio. Los timeouts propios
        # no se reintentan para no duplicar la latencia ya alta de cada turno.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.ai.retry.TransientAiException
          - java.io.IOException
        ignore-exceptions:
          - org.springframework.ai.retry.NonTransientAiException
          - java.lang.IllegalArgumentException

orchestrator:
  state:
    # Los estados pausados/fallidos se guardan aquí para sobrevivir reinicios.
    # Vacío desactiva la persistencia.
    directory: .flow-state
  mcp-servers:
    mcp-domain: ${services.mcp-domain.base-url}
    mcp-notifications: ${services.mcp-notifications.base-url}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  health:
    circuitbreakers:
      enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
